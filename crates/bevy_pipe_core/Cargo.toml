[package]
name = "bevy_pipe_core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deterministic, versioned game-simulation pipe core for Bevy GameSim"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
bevy_gamesim_ast = { path = "../../ast" }
[lib]
name = "bevy_pipe_core"
path = "src/lib.rs"
