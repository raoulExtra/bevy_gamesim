[package]
name = "bevy_gamesim_ast"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Reusable JSON AST compiler for Bevy GameSim descriptions"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lib]
name = "bevy_gamesim_ast"
path = "src/lib.rs"
